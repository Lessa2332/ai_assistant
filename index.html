<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <title>Web AR Промінь і Рука</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
      font-family: system-ui, sans-serif;
    }
    #camVideo {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      z-index: 1;
    }
    #sceneCanvas {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      z-index: 2;
      pointer-events: none;
    }
    #status {
      position: fixed;
      top: 12px;
      left: 12px;
      z-index: 3;
      padding: 6px 10px;
      border-radius: 8px;
      background: rgba(0, 0, 0, 0.55);
      color: #fff;
      font-size: 13px;
    }
  </style>
  <script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com/three@0.160.0/build/three.module.js"
      }
    }
  </script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
</head>
<body>
  <video id="camVideo" playsinline autoplay muted></video>
  <canvas id="sceneCanvas"></canvas>
  <div id="status">Запуск камери...</div>

  <script type="module">
    import * as THREE from 'three';

    const videoEl = document.getElementById('camVideo');
    const canvasEl = document.getElementById('sceneCanvas');
    const statusEl = document.getElementById('status');

    // 1. Налаштування сцени Three.js (прозорий фон поверх камери)
    const renderer = new THREE.WebGLRenderer({ canvas: canvasEl, alpha: true, antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));

    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.01, 50);
    camera.position.set(0, 0, 2);

    const light = new THREE.HemisphereLight(0xffffff, 0x444466, 1.5);
    scene.add(light);

    // 2. Цільовий 3D-об'єкт у сцені
    const targetMesh = new THREE.Mesh(
      new THREE.SphereGeometry(0.28, 32, 32),
      new THREE.MeshStandardMaterial({ color: 0x38bdf8, roughness: 0.3, metalness: 0.2 })
    );
    targetMesh.position.set(0, 0.15, -1.2);
    scene.add(targetMesh);

    // 3. Промінь-вказівник (лінія від пальця до точки влучання або вперед)
    const beamGeo = new THREE.BufferGeometry().setFromPoints([
      new THREE.Vector3(0, 0, 0),
      new THREE.Vector3(0, 0, -1)
    ]);
    const beamMat = new THREE.LineBasicMaterial({ color: 0x7dd3fc });
    const beamLine = new THREE.Line(beamGeo, beamMat);
    beamLine.visible = false;
    scene.add(beamLine);

    // 4. Візуальні точки суглобів для акценту на руці поверх камери
    const jointGeo = new THREE.SphereGeometry(0.022, 12, 12);
    const jointMat = new THREE.MeshBasicMaterial({ color: 0xfef08a, transparent: true, opacity: 0.85 });
    const handPoints = Array.from({ length: 21 }, () => {
      const m = new THREE.Mesh(jointGeo, jointMat);
      m.visible = false;
      scene.add(m);
      return m;
    });

    const raycaster = new THREE.Raycaster();

    // Перетворення нормалізованих координат MediaPipe (0..1) у простір сцени
    function landmarkToWorld(lm, zDepth = -0.7) {
      const ndcX = (lm.x - 0.5) * 2;
      const ndcY = -(lm.y - 0.5) * 2;
      const vec = new THREE.Vector3(ndcX, ndcY, 0.5).unproject(camera);
      const dir = vec.sub(camera.position).normalize();
      const distance = Math.abs(zDepth - camera.position.z) / Math.max(Math.abs(dir.z), 0.1);
      return camera.position.clone().addScaledVector(dir, distance);
    }

    // 5. Трекінг руки через MediaPipe Hands
    const hands = new Hands({
      locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`
    });

    hands.setOptions({
      maxNumHands: 1,
      modelComplexity: 1,
      minDetectionConfidence: 0.65,
      minTrackingConfidence: 0.6
    });

    hands.onResults((results) => {
      targetMesh.rotation.y += 0.015;

      const landmarks = results.multiHandLandmarks && results.multiHandLandmarks[0];
      if (!landmarks) {
        statusEl.textContent = 'Покажіть руку перед камерою';
        beamLine.visible = false;
        handPoints.forEach((p) => (p.visible = false));
        targetMesh.material.emissive.setHex(0x000000);
        renderer.render(scene, camera);
        return;
      }

      statusEl.textContent = 'Руку виявлено — наведіть вказівним пальцем';

      // Оновлюємо точки поверх руки з камери
      landmarks.forEach((lm, idx) => {
        const pos = landmarkToWorld(lm, -0.65);
        handPoints[idx].position.copy(pos);
        handPoints[idx].visible = true;
      });

      // Промінь від основи вказівного пальця (5) через кінчик (8)
      const mcp = landmarkToWorld(landmarks[5], -0.65);
      const tip = landmarkToWorld(landmarks[8], -0.65);
      const dir = tip.clone().sub(mcp).normalize();

      raycaster.set(tip, dir);
      const hits = raycaster.intersectObject(targetMesh, false);

      const endPoint = hits.length > 0
        ? hits[0].point
        : tip.clone().addScaledVector(dir, 1.8);

      targetMesh.material.emissive.setHex(hits.length > 0 ? 0x1d4ed8 : 0x000000);

      beamLine.geometry.setFromPoints([tip, endPoint]);
      beamLine.visible = true;

      renderer.render(scene, camera);
    });

    // 6. Запуск задньої камери смартфона
    async function startCamera() {
      try {
        const stream = await navigator.mediaDevices.getUserMedia({
          video: { facingMode: { ideal: 'environment' } },
          audio: false
        });
        videoEl.srcObject = stream;
        await videoEl.play();

        const mpCamera = new Camera(videoEl, {
          onFrame: async () => {
            await hands.send({ image: videoEl });
          },
          width: 640,
          height: 480
        });
        mpCamera.start();
      } catch (err) {
        statusEl.textContent = 'Помилка доступу до камери: відкрийте через HTTPS';
      }
    }

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    startCamera();
  </script>
</body>
</html>
